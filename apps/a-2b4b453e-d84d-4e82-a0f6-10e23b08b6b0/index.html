<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="merkalan-id" content="a-2b4b453e-d84d-4e82-a0f6-10e23b08b6b0">
<title>AuditaTuWeb · demo MerkaLan</title>
<style>:root{--accent:#6d28d9;--ink:#111827;--muted:#6b7280;--line:rgba(17,24,39,.08);--bg:#f8f8fb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:20px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem;line-height:1.4}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(17,24,39,.05),0 16px 40px rgba(17,24,39,.10)}
h2,h3{margin:0 0 14px;font-size:1.05rem}
.checks{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:background .2s cubic-bezier(.2,.8,.2,1)}
.check:hover{background:#faf9ff}
.check input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.check span{font-size:.92rem;line-height:1.3}
.btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),filter .25s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.oculto{display:none}
.score-row{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.score{font-size:2.6rem;font-weight:700;color:var(--accent);line-height:1}
.nivel{font-weight:600;text-transform:capitalize}
.detalle{color:var(--muted);font-size:.88rem;margin-top:4px}
.mejoras{margin:0;padding-left:20px;color:var(--ink);font-size:.92rem;line-height:1.7}</style>
<style>
#mk-banda{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(15,23,42,.08);color:#4f46e5;font:600 12px/1.3 system-ui,sans-serif;letter-spacing:.04em;padding:8px 12px;text-align:center}
#mk-firma{position:fixed;right:10px;bottom:10px;z-index:99;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(15,23,42,.12);box-shadow:0 8px 24px -8px rgba(16,24,40,.2);color:#0b1220;font:500 12px system-ui,sans-serif;padding:6px 11px;border-radius:99px;transition:opacity .6s;pointer-events:none}
#mk-firma.fuera{opacity:0}
</style></head>
<body>
<div id="mk-banda">Demo creada por IA en directo en MerkaLan · MEATZE · caduca el 25/11/2026</div>
<main id="app"><section class="hero">
  <h1>AuditaTuWeb</h1>
  <p class="sub">Marca lo que cumple tu página y obtén una puntuación con plan de mejoras.</p>
</section>

<section class="card">
  <h2>Checklist rápida</h2>
  <div id="checks" class="checks"></div>
  <button id="btn" class="btn">Calcular auditoría</button>
</section>

<section id="resultado" class="card resultado oculto">
  <div class="score-row">
    <div id="puntos" class="score">0</div>
    <div>
      <div id="nivel" class="nivel">—</div>
      <div id="detalle" class="detalle"></div>
    </div>
  </div>
  <h3>Prioridad de mejoras</h3>
  <ol id="mejoras" class="mejoras"></ol>
</section></main>
<div id="mk-firma">Creado por Ouail El Garhioui</div>
<script src="logica.js"></script>
<script>
(function () {
  var f = document.getElementById('mk-firma'), t = null;
  ['pointermove', 'pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function (ev) {
    addEventListener(ev, function () { f.classList.add('fuera'); clearTimeout(t); t = setTimeout(function () { f.classList.remove('fuera'); }, 25000); }, { passive: true });
  });
  if (Date.now() > new Date("2026-11-25T14:22:42.527Z").getTime()) {
    document.getElementById('app').innerHTML = '<p style="padding:24px;font:18px system-ui">Esta demo de MerkaLan ha caducado. Si quieres una app así, escríbenos: secretaria.bilbao@meatze.eus · 94 421 27 02</p>';
    return;
  }
  try {
const CHECKS = [
  { id: 'https', texto: '🔒 Usa HTTPS en todas las páginas', peso: 3 },
  { id: 'responsive', texto: '📱 Se ve bien en móvil', peso: 3 },
  { id: 'alt', texto: '🖼️ Las imágenes tienen texto alternativo', peso: 2 },
  { id: 'contraste', texto: '🎨 Contraste de color suficiente', peso: 2 },
  { id: 'velocidad', texto: '⚡ Carga en menos de 3 segundos', peso: 3 },
  { id: 'titulos', texto: '🏷️ Títulos jerárquicos correctos', peso: 1 },
  { id: 'enlaces', texto: '🔗 Enlaces con texto descriptivo', peso: 1 }
];

const cont = document.getElementById('checks');
CHECKS.forEach(function (c) {
  const label = document.createElement('label');
  label.className = 'check';
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.id = 'chk-' + c.id;
  const span = document.createElement('span');
  span.textContent = c.texto;
  label.appendChild(input);
  label.appendChild(span);
  cont.appendChild(label);
});

document.getElementById('btn').addEventListener('click', function () {
  const checks = {};
  const pesos = {};
  CHECKS.forEach(function (c) {
    checks[c.id] = document.getElementById('chk-' + c.id).checked;
    pesos[c.id] = c.peso;
  });
  const r = resumenAuditoria(checks, pesos);
  document.getElementById('puntos').textContent = r.puntos;
  document.getElementById('nivel').textContent = r.nivel;
  document.getElementById('detalle').textContent = r.fallos + ' de ' + r.total + ' puntos a mejorar';
  const lista = document.getElementById('mejoras');
  lista.innerHTML = '';
  const ordenadas = priorizarMejoras(checks, pesos);
  if (ordenadas.length === 0) {
    const li = document.createElement('li');
    li.textContent = '¡Todo en orden! Mantén la auditoría periódica.';
    lista.appendChild(li);
  } else {
    ordenadas.forEach(function (id) {
      const c = CHECKS.find(function (x) { return x.id === id; });
      const li = document.createElement('li');
      li.textContent = c ? c.texto : id;
      lista.appendChild(li);
    });
  }
  document.getElementById('resultado').classList.remove('oculto');
  try { localStorage.setItem('auditaweb', JSON.stringify(checks)); } catch (e) {}
});
  } catch (err) { console.error(err); }
})();
</script>
</body></html>
